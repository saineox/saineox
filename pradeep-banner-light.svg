  <path d="M15 52 L30 43.34 L30 26" fill="none" stroke="rgba(9,105,218,0.05)" stroke-width="1"/>
  <path d="M0 26 L0 43.34 L15 52" fill="none" stroke="rgba(9,105,218,0.05)" stroke-width="1"/>
