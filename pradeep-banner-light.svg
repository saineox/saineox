<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="Pradeep Kadam - Senior Cloud Architect">
<title>Pradeep Kadam — Senior Cloud Architect</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif,'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.7)}70%{opacity:1;transform:translateY(-3px) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.18)}48%{transform:scale(1)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.55}88%{opacity:.55}100%{transform:translateY(-46px);opacity:0}}
.ltr{opacity:0;animation:popIn .5s cubic-bezier(.2,.8,.3,1.3) forwards;transform-box:fill-box;transform-origin:center bottom}
.cur{animation:blink 1s step-end infinite}
.fl{animation:floaty 5s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.hb{transform-box:fill-box;transform-origin:center;animation:heartBeat 2.2s ease-in-out infinite}
.rp{animation:rise linear infinite}
.fade{opacity:0;animation:fadeIn .5s ease forwards}
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#f6f8fa"/><stop offset="50%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f6f8fa"/>
</linearGradient>
<linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#0969da;#116329;#b35900;#0969da" dur="7s" repeatCount="indefinite"/></stop>
  <stop offset="50%"><animate attributeName="stop-color" values="#116329;#b35900;#0969da;#116329" dur="7s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#b35900;#0969da;#116329;#b35900" dur="7s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="borderg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0969da" stop-opacity=".35"/>
  <stop offset="50%" stop-color="#116329" stop-opacity=".3"/>
  <stop offset="100%" stop-color="#b35900" stop-opacity=".35"/>
</linearGradient>
<radialGradient id="orbC"><stop offset="0%" stop-color="#0969da" stop-opacity=".08"/><stop offset="100%" stop-color="#0969da" stop-opacity="0"/></radialGradient>
<radialGradient id="orbG"><stop offset="0%" stop-color="#116329" stop-opacity=".08"/><stop offset="100%" stop-color="#116329" stop-opacity="0"/></radialGradient>
<radialGradient id="orbY"><stop offset="0%" stop-color="#b35900" stop-opacity=".05"/><stop offset="100%" stop-color="#b35900" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="hex" width="30" height="52" patternUnits="userSpaceOnUse">
