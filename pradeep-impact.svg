<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 100" width="820" height="100">
<defs>
<style>
text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade { opacity: 0; animation: fadeIn 0.6s ease forwards; }
</style>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0a0e17"/><stop offset="50%" stop-color="#0d1321"/><stop offset="100%" stop-color="#0a0e17"/>
</linearGradient>
</defs>
<rect width="820" height="100" rx="12" fill="url(#bg)" stroke="#1e2d4a" stroke-width="1"/>
<line x1="273" y1="20" x2="273" y2="80" stroke="#1e2d4a" stroke-width="1"/>
<line x1="546" y1="20" x2="546" y2="80" stroke="#1e2d4a" stroke-width="1"/>

<!-- Block 1 -->
<g class="fade" style="animation-delay: 0.2s">
<text x="136" y="45" text-anchor="middle" font-size="20" fill="#00d4ff" font-weight="bold" filter="url(#glow)">6+ Years</text>
<text x="136" y="45" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="bold">6+ Years</text>
<text x="136" y="70" text-anchor="middle" font-size="14" fill="#8b949e">Experience</text>
</g>

<!-- Block 2 -->
<g class="fade" style="animation-delay: 0.4s">
<text x="409" y="45" text-anchor="middle" font-size="20" fill="#00e5a0" font-weight="bold" filter="url(#glow)">$12k/yr Saved</text>
<text x="409" y="45" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="bold">$12k/yr Saved</text>
<text x="409" y="70" text-anchor="middle" font-size="14" fill="#8b949e">Cloud Optimization</text>
</g>

<!-- Block 3 -->
<g class="fade" style="animation-delay: 0.6s">
<text x="683" y="45" text-anchor="middle" font-size="20" fill="#ffd700" font-weight="bold" filter="url(#glow)">40% Faster</text>
<text x="683" y="45" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="bold">40% Faster</text>
<text x="683" y="70" text-anchor="middle" font-size="14" fill="#8b949e">Deploy Cycles</text>
</g>
</svg>
