  <rect x="140" y="150" width="130" height="30" rx="15" fill="rgba(32,136,255,0.1)" stroke="#2088ff" stroke-width="1"/>
  <text x="205" y="170" text-anchor="middle" font-size="13" fill="#2088ff" font-weight="bold">GitHub Actions</text>
</g>
