  <text x="530" y="170" text-anchor="middle" font-size="13" fill="#1904da" font-weight="bold">Trivy</text>
</g>

<!-- Title 3 & 4 (Columns) -->
<text x="40" y="220" font-size="16" fill="#e6edf3" font-weight="bold">📊 Observability</text>
<g class="fade" style="animation-delay:0.6s">
  <rect x="40" y="240" width="110" height="30" rx="15" fill="rgba(230,82,44,0.1)" stroke="#e6522c" stroke-width="1"/>
  <text x="95" y="260" text-anchor="middle" font-size="13" fill="#e6522c" font-weight="bold">Prometheus</text>
</g>
<g class="fade" style="animation-delay:0.6s">
  <rect x="160" y="240" width="90" height="30" rx="15" fill="rgba(244,104,0,0.1)" stroke="#f46800" stroke-width="1"/>
  <text x="205" y="260" text-anchor="middle" font-size="13" fill="#f46800" font-weight="bold">Grafana</text>
</g>
<g class="fade" style="animation-delay:0.6s">
  <rect x="40" y="280" width="100" height="30" rx="15" fill="rgba(0,85,113,0.1)" stroke="#005571" stroke-width="1"/>
  <text x="90" y="300" text-anchor="middle" font-size="13" fill="#005571" font-weight="bold">ELK Stack</text>
</g>

<text x="350" y="220" font-size="16" fill="#e6edf3" font-weight="bold">⚙️ Scripting &amp; Tools</text>
<g class="fade" style="animation-delay:0.8s">
  <rect x="350" y="240" width="80" height="30" rx="15" fill="rgba(55,118,171,0.1)" stroke="#3776ab" stroke-width="1"/>
  <text x="390" y="260" text-anchor="middle" font-size="13" fill="#3776ab" font-weight="bold">Python</text>
</g>
<g class="fade" style="animation-delay:0.8s">
  <rect x="440" y="240" width="70" height="30" rx="15" fill="rgba(78,170,37,0.1)" stroke="#4eaa25" stroke-width="1"/>
  <text x="475" y="260" text-anchor="middle" font-size="13" fill="#4eaa25" font-weight="bold">Bash</text>
</g>
<g class="fade" style="animation-delay:0.8s">
  <rect x="520" y="240" width="60" height="30" rx="15" fill="rgba(240,80,50,0.1)" stroke="#f05032" stroke-width="1"/>
  <text x="550" y="260" text-anchor="middle" font-size="13" fill="#f05032" font-weight="bold">Git</text>
