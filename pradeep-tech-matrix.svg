<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360">
<defs>
<style>
text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.fade { opacity: 0; animation: fadeIn 0.8s ease forwards; }
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0a0e17"/><stop offset="50%" stop-color="#0d1321"/><stop offset="100%" stop-color="#0a0e17"/>
</linearGradient>
</defs>
<rect width="820" height="360" rx="12" fill="url(#bg)" stroke="#1e2d4a" stroke-width="1"/>

<!-- Title 1 -->
<text x="40" y="40" font-size="16" fill="#e6edf3" font-weight="bold">☁️ Cloud &amp; Orchestration</text>
<!-- pills -->
<g class="fade" style="animation-delay:0.2s">
  <rect x="40" y="60" width="80" height="30" rx="15" fill="rgba(255,153,0,0.1)" stroke="#ff9900" stroke-width="1"/>
  <text x="80" y="80" text-anchor="middle" font-size="13" fill="#ff9900" font-weight="bold">AWS</text>
</g>
<g class="fade" style="animation-delay:0.2s">
  <rect x="130" y="60" width="100" height="30" rx="15" fill="rgba(238,0,0,0.1)" stroke="#ee0000" stroke-width="1"/>
  <text x="180" y="80" text-anchor="middle" font-size="13" fill="#ee0000" font-weight="bold">OpenShift</text>
</g>
<g class="fade" style="animation-delay:0.2s">
  <rect x="240" y="60" width="110" height="30" rx="15" fill="rgba(50,108,229,0.1)" stroke="#326ce5" stroke-width="1"/>
  <text x="295" y="80" text-anchor="middle" font-size="13" fill="#326ce5" font-weight="bold">Kubernetes</text>
</g>
<g class="fade" style="animation-delay:0.2s">
  <rect x="360" y="60" width="80" height="30" rx="15" fill="rgba(36,150,237,0.1)" stroke="#2496ed" stroke-width="1"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" fill="#2496ed" font-weight="bold">Docker</text>
</g>
<g class="fade" style="animation-delay:0.2s">
  <rect x="450" y="60" width="100" height="30" rx="15" fill="rgba(123,66,188,0.1)" stroke="#7b42bc" stroke-width="1"/>
  <text x="500" y="80" text-anchor="middle" font-size="13" fill="#7b42bc" font-weight="bold">Terraform</text>
</g>

<!-- Title 2 -->
<text x="40" y="130" font-size="16" fill="#e6edf3" font-weight="bold">🔄 CI/CD &amp; DevSecOps</text>
<g class="fade" style="animation-delay:0.4s">
