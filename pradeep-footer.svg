<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 100" width="1280" height="100">
<defs>
<linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
  <stop offset="100%" style="stop-color:#0d1321;stop-opacity:1" />
</linearGradient>
<linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
  <stop offset="50%" style="stop-color:#00e5a0;stop-opacity:0.3" />
  <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0.3" />
</linearGradient>
</defs>
<rect width="1280" height="100" fill="url(#grad1)"/>
<!-- Animated Wave -->
<path d="M 0,50 Q 320,10 640,50 T 1280,50 L 1280,100 L 0,100 Z" fill="url(#grad2)">
  <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
    M 0,50 Q 320,10 640,50 T 1280,50 L 1280,100 L 0,100 Z;
    M 0,50 Q 320,90 640,50 T 1280,50 L 1280,100 L 0,100 Z;
    M 0,50 Q 320,10 640,50 T 1280,50 L 1280,100 L 0,100 Z" />
</path>
</svg>
